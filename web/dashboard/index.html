<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoThinkDB Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        h1 {
            color: #667eea;
            font-size: 2em;
            margin-bottom: 10px;
        }

        .status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
        }

        .status.healthy {
            background: #10b981;
            color: white;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .card h2 {
            color: #667eea;
            font-size: 1.3em;
            margin-bottom: 15px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .stat {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .stat:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: #6b7280;
            font-weight: 500;
        }

        .stat-value {
            color: #1f2937;
            font-weight: 600;
        }

        .list {
            list-style: none;
        }

        .list li {
            padding: 10px;
            background: #f9fafb;
            margin-bottom: 5px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #5568d3;
        }

        .btn-danger {
            background: #ef4444;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .query-editor {
            width: 100%;
            min-height: 150px;
            padding: 10px;
            border: 2px solid #e5e7eb;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: vertical;
        }

        .query-result {
            background: #f9fafb;
            padding: 15px;
            border-radius: 5px;
            margin-top: 10px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            white-space: pre-wrap;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #6b7280;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
        }

        .success {
            background: #d1fae5;
            color: #065f46;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 GoThinkDB Dashboard</h1>
            <div id="health-status" class="status">Verificando...</div>
        </header>

        <div class="grid">
            <div class="card">
                <h2>📊 Server Info</h2>
                <div id="server-info">
                    <div class="loading">Carregando...</div>
                </div>
            </div>

            <div class="card">
                <h2>📈 Server Stats</h2>
                <div id="server-stats">
                    <div class="loading">Carregando...</div>
                </div>
            </div>

            <div class="card">
                <h2>🗄️ Databases</h2>
                <div id="databases">
                    <div class="loading">Carregando...</div>
                </div>
                <button class="btn" onclick="createDatabase()" style="margin-top: 10px;">+ Create Database</button>
            </div>

            <div class="card">
                <h2>📋 Tables</h2>
                <div id="tables">
                    <div class="loading">Carregando...</div>
                </div>
                <button class="btn" onclick="createTable()" style="margin-top: 10px;">+ Create Table</button>
            </div>

            <div class="card">
                <h2>🌐 Cluster Status</h2>
                <div id="cluster-status">
                    <div class="loading">Carregando...</div>
                </div>
            </div>

            <div class="card">
                <h2>👥 Cluster Members</h2>
                <div id="cluster-members">
                    <div class="loading">Carregando...</div>
                </div>
            </div>
        </div>

        <div class="card" style="margin-bottom: 20px;">
            <h2>🔍 Query Editor</h2>
            <textarea id="query-input" class="query-editor" placeholder="Enter ReQL query as JSON...
Example: [10, "test_table"]"></textarea>
            <button class="btn" onclick="executeQuery()" style="margin-top: 10px;">Execute Query</button>
            <div id="query-result" class="query-result" style="display: none;"></div>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;

        async function fetchJSON(url, options = {}) {
            try {
                const response = await fetch(url, options);
                const data = await response.json();
                return { success: true, data };
            } catch (error) {
                return { success: false, error: error.message };
            }
        }

        async function checkHealth() {
            const result = await fetchJSON(`${API_URL}/api/health`);
            const statusEl = document.getElementById('health-status');
            if (result.success && result.data.status === 'healthy') {
                statusEl.textContent = '✓ Healthy';
                statusEl.className = 'status healthy';
            } else {
                statusEl.textContent = '✗ Unhealthy';
                statusEl.className = 'status';
                statusEl.style.background = '#ef4444';
                statusEl.style.color = 'white';
            }
        }

        async function loadServerInfo() {
            const result = await fetchJSON(`${API_URL}/api/server/info`);
            const container = document.getElementById('server-info');
            if (result.success) {
                container.innerHTML = `
                    <div class="stat">
                        <span class="stat-label">Version</span>
                        <span class="stat-value">${result.data.version || 'N/A'}</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Server</span>
                        <span class="stat-value">${result.data.server || 'N/A'}</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Status</span>
                        <span class="stat-value">${result.data.status || 'N/A'}</span>
                    </div>
                `;
            } else {
                container.innerHTML = '<div class="error">Failed to load</div>';
            }
        }

        async function loadServerStats() {
            const result = await fetchJSON(`${API_URL}/api/server/stats`);
            const container = document.getElementById('server-stats');
            if (result.success) {
                container.innerHTML = `
                    <div class="stat">
                        <span class="stat-label">Queries Total</span>
                        <span class="stat-value">${result.data.queries_total || 0}</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Queries/sec</span>
                        <span class="stat-value">${result.data.queries_per_second || 0}</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Connections</span>
                        <span class="stat-value">${result.data.connections || 0}</span>
                    </div>
                `;
            } else {
                container.innerHTML = '<div class="error">Failed to load</div>';
            }
        }

        async function loadDatabases() {
            const result = await fetchJSON(`${API_URL}/api/databases`);
            const container = document.getElementById('databases');
            if (result.success && Array.isArray(result.data)) {
                if (result.data.length === 0) {
                    container.innerHTML = '<p style="color: #6b7280;">No databases found</p>';
                } else {
                    container.innerHTML = '<ul class="list">' + 
                        result.data.map(db => `
                            <li>
                                <span>${db}</span>
                                <button class="btn btn-danger" onclick="dropDatabase('${db}')">Drop</button>
                            </li>
                        `).join('') + '</ul>';
                }
            } else {
                container.innerHTML = '<div class="error">Failed to load</div>';
            }
        }

        async function loadTables() {
            const result = await fetchJSON(`${API_URL}/api/tables?db=test`);
            const container = document.getElementById('tables');
            if (result.success && Array.isArray(result.data)) {
                if (result.data.length === 0) {
                    container.innerHTML = '<p style="color: #6b7280;">No tables found</p>';
                } else {
                    container.innerHTML = '<ul class="list">' + 
                        result.data.map(table => `
                            <li>
                                <span>${table}</span>
                                <button class="btn btn-danger" onclick="dropTable('${table}')">Drop</button>
                            </li>
                        `).join('') + '</ul>';
                }
            } else {
                container.innerHTML = '<div class="error">Failed to load</div>';
            }
        }

        async function loadClusterStatus() {
            const result = await fetchJSON(`${API_URL}/api/cluster/status`);
            const container = document.getElementById('cluster-status');
            if (result.success) {
                container.innerHTML = `
                    <div class="stat">
                        <span class="stat-label">Status</span>
                        <span class="stat-value">${result.data.status || 'N/A'}</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Members</span>
                        <span class="stat-value">${result.data.members || 0}</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Leader</span>
                        <span class="stat-value">${result.data.leader || 'N/A'}</span>
                    </div>
                `;
            } else {
                container.innerHTML = '<div class="error">Failed to load</div>';
            }
        }

        async function loadClusterMembers() {
            const result = await fetchJSON(`${API_URL}/api/cluster/members`);
            const container = document.getElementById('cluster-members');
            if (result.success && Array.isArray(result.data)) {
                if (result.data.length === 0) {
                    container.innerHTML = '<p style="color: #6b7280;">No members found</p>';
                } else {
                    container.innerHTML = '<ul class="list">' + 
                        result.data.map(member => `
                            <li>
                                <span>${member.node_id || member}</span>
                                <span class="stat-value">${member.status || 'active'}</span>
                            </li>
                        `).join('') + '</ul>';
                }
            } else {
                container.innerHTML = '<div class="error">Failed to load</div>';
            }
        }

        async function createDatabase() {
            const name = prompt('Enter database name:');
            if (!name) return;

            const result = await fetchJSON(`${API_URL}/api/databases`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name })
            });

            if (result.success) {
                alert('Database created successfully!');
                loadDatabases();
            } else {
                alert('Failed to create database: ' + result.error);
            }
        }

        async function dropDatabase(name) {
            if (!confirm(`Are you sure you want to drop database "${name}"?`)) return;

            const result = await fetchJSON(`${API_URL}/api/databases/${name}`, {
                method: 'DELETE'
            });

            if (result.success) {
                alert('Database dropped successfully!');
                loadDatabases();
            } else {
                alert('Failed to drop database: ' + result.error);
            }
        }

        async function createTable() {
            const name = prompt('Enter table name:');
            if (!name) return;

            const result = await fetchJSON(`${API_URL}/api/tables/${name}?db=test`, {
                method: 'POST'
            });

            if (result.success) {
                alert('Table created successfully!');
                loadTables();
            } else {
                alert('Failed to create table: ' + result.error);
            }
        }

        async function dropTable(name) {
            if (!confirm(`Are you sure you want to drop table "${name}"?`)) return;

            const result = await fetchJSON(`${API_URL}/api/tables/${name}?db=test`, {
                method: 'DELETE'
            });

            if (result.success) {
                alert('Table dropped successfully!');
                loadTables();
            } else {
                alert('Failed to drop table: ' + result.error);
            }
        }

        async function executeQuery() {
            const queryInput = document.getElementById('query-input').value;
            const resultContainer = document.getElementById('query-result');
            
            try {
                const query = JSON.parse(queryInput);
                const result = await fetchJSON(`${API_URL}/api/query`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });

                resultContainer.style.display = 'block';
                if (result.success) {
                    resultContainer.textContent = JSON.stringify(result.data, null, 2);
                    resultContainer.className = 'query-result success';
                } else {
                    resultContainer.textContent = 'Error: ' + result.error;
                    resultContainer.className = 'query-result error';
                }
            } catch (error) {
                resultContainer.style.display = 'block';
                resultContainer.textContent = 'Invalid JSON: ' + error.message;
                resultContainer.className = 'query-result error';
            }
        }

        // Load all data on page load
        async function loadAll() {
            await checkHealth();
            await Promise.all([
                loadServerInfo(),
                loadServerStats(),
                loadDatabases(),
                loadTables(),
                loadClusterStatus(),
                loadClusterMembers()
            ]);
        }

        loadAll();
        setInterval(loadAll, 5000); // Refresh every 5 seconds
    </script>
</body>
</html>
