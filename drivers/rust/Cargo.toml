[package]
name = "gothinkdb"
version = "0.1.7"
edition = "2021"
description = "GoThinkDB driver for Rust - RethinkDB compatible"
license = "Apache-2.0"
repository = "https://github.com/leandroasilva/gothinkdb"
readme = "README.md"
keywords = ["rethinkdb", "gothinkdb", "database", "reql", "driver"]
categories = ["database"]

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
tokio-test = "0.4"
